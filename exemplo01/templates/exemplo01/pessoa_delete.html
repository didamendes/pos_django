{% extends 'base.html' %}
{% load static %}

{% block title %}Excluir Pessoas{% endblock %}

{% block content %}
    <div class="container">
        <div class="col-md-12 col-sm-12 col-xs-12">
            <center>
                <p>bdpratico\exemplo01\templates\exemplo01\pessoa_delete.html</p>
                <img src="{% static 'pessoa.png' %}" class="img-fluid" alt="Teste" width="15%">
                <form method="POST">
                    {% csrf_token %}
                    <p>{{object.nome}}</p>
                    <button type="submit" class="btn btn-danger">Sim, exclua!</button> &nbsp;
                </form>
            </center>
        </div>
    </div>
{% endblock %}
